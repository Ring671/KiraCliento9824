<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kira Client</title>
<style>
  :root { --head:#3f2154; --body:#4a2068; --view:#221e20; --field:#2c1740; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { display: flex; flex-direction: column; color: #fff; font: 16px Consolas, "Courier New", monospace;
         background: linear-gradient(var(--body), #45215f); }
  header { display: flex; align-items: center; gap: 16px; padding: 10px 14px; background: var(--head); border-bottom: 3px solid #000; }
  h1 { margin: 0; font-size: 34px; font-weight: 400; white-space: nowrap; }
  form { flex: 1; display: flex; gap: 8px; min-width: 0; }
  input { flex: 1; min-width: 0; padding: 9px 12px; border: 2px solid #fff; background: var(--field); color: #fff; font: inherit; }
  input::placeholder { color: #b9a3cc; }
  button { padding: 9px 14px; border: 2px solid #fff; background: transparent; color: #fff; font: inherit; cursor: pointer; }
  button:hover { background: rgba(255,255,255,.15); }
  input:focus-visible, button:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
  main { flex: 1; padding: 4% 8%; min-height: 0; }
  #box { position: relative; width: 100%; height: 100%; border: 3px solid #fff; background: var(--view); overflow: hidden; }
  #empty { position: absolute; inset: 0; display: grid; place-items: center; font-size: clamp(32px, 6vw, 56px); }
  iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; background: #fff; }
  @media (max-width: 600px) { h1 { font-size: 22px; } header { flex-wrap: wrap; } main { padding: 16px; } }
</style>
</head>
<body>
<header>
  <h1>Kira Client</h1>
  <form id="f">
    <input id="u" type="text" placeholder="Enter a URL, e.g. example.com" autocomplete="off" autofocus>
    <button type="submit">Go</button>
    <button type="button" id="tab">New tab</button>
  </form>
</header>
<main>
  <div id="box">
    <div id="empty">Viewport</div>
    <iframe id="v" hidden title="Viewport" referrerpolicy="no-referrer"
      allow="fullscreen; clipboard-read; clipboard-write; camera; microphone; geolocation"
      sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-popups-to-escape-sandbox allow-modals allow-presentation allow-downloads"></iframe>
  </div>
</main>
<script>
  const f = document.getElementById('f'), u = document.getElementById('u'),
        v = document.getElementById('v'), empty = document.getElementById('empty');
  const norm = s => { s = s.trim(); if (!s) return ''; return /^(https?:|about:|data:|blob:|file:)/i.test(s) ? s : 'https://' + s; };
  function load(s) {
    const url = norm(s); if (!url) return;
    u.value = url; empty.hidden = true; v.hidden = false;
    v.src = /^https?:$/.test(location.protocol) ? '/proxy?url=' + encodeURIComponent(url) : url;
    history.replaceState(null, '', '#' + encodeURIComponent(url));
  }
  f.addEventListener('submit', e => { e.preventDefault(); load(u.value); });
  document.getElementById('tab').onclick = () => { const x = norm(u.value); if (x) window.open(x, '_blank', 'noopener'); };
  if (location.hash.length > 1) load(decodeURIComponent(location.hash.slice(1)));
</script>
</body>
</html>
